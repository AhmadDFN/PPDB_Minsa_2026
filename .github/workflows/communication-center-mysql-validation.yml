name: Communication Center MySQL Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ci/phase-3-mysql-validation

permissions:
  contents: read

jobs:
  mysql-validation:
    name: MySQL 8 concurrency and feature validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NIK_HMAC_KEY: ci-only-nik-hmac-key
      OTP_HMAC_KEY: ci-only-otp-hmac-key
      DB_CONNECTION: mysql_test
      DB_DATABASE: ppdb_minsatama_cc_concurrency_test
      DB_TEST_URL: ''
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: ppdb_minsatama_cc_concurrency_test
      DB_TEST_USERNAME: ppdb_ci
      DB_TEST_PASSWORD: ppdb_ci_password
      DB_TEST_SOCKET: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      OTP_DRIVER: array
      OTP_DELIVERY_DRIVER: array
      COMMUNICATION_CENTER_MYSQL_CONCURRENCY: '1'
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
      NIGHTWATCH_ENABLED: 'false'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: ppdb_minsatama_cc_concurrency_test
          MYSQL_USER: ppdb_ci
          MYSQL_PASSWORD: ppdb_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, gd, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Verify disposable MySQL service
        env:
          MYSQL_PWD: ppdb_ci_password
        run: |
          set -euo pipefail
          test "$DB_TEST_DATABASE" = "ppdb_minsatama_cc_concurrency_test"
          test "$DB_TEST_HOST" = "127.0.0.1"
          mysql --protocol=TCP -h "$DB_TEST_HOST" -P "$DB_TEST_PORT" -u "$DB_TEST_USERNAME" \
            -e "SELECT DATABASE() AS database_name; SELECT @@default_storage_engine AS default_engine;"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare disposable database schema
        run: php artisan migrate --database=mysql_test --force

      - name: Run Communication Center feature tests
        run: php artisan test tests/Feature/Admin/CommunicationCenterTest.php --compact

      - name: Require dedicated Communication Center concurrency harness
        run: |
          if [ ! -f tests/Feature/Database/MySqlCommunicationCenterConcurrencyTest.php ]; then
            echo "Dedicated MySQL Communication Center concurrency harness is not present."
            echo "This CI job must not report sequential tests as concurrency validation."
            exit 1
          fi

      - name: Run Communication Center MySQL concurrency tests
        run: php artisan test tests/Feature/Database/MySqlCommunicationCenterConcurrencyTest.php --compact

      - name: Run registration MySQL concurrency tests
        run: php artisan test tests/Feature/Database/MySqlRegistrationConcurrencyTest.php --compact

      - name: Run full Feature regression suite
        run: php artisan test --testsuite=Feature --stop-on-failure --compact
